<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Keke – Video Portfolio</title>

  <meta name="description" content="MC Keke video portfolio. Watch comedy and event highlights directly on the website.">
  <meta name="author" content="MC Keke">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #000;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* VIDEO GRID */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .video-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.1);
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-info {
      padding: 1rem;
      text-align: center;
    }

    .video-info h3 {
      margin: .5rem 0;
      font-size: 1.1rem;
    }

    .video-info a {
      display: inline-block;
      margin-top: .5rem;
      text-decoration: none;
      font-weight: 600;
      color: #d62828;
    }

    footer {
      margin-top: 3rem;
      padding: 1.5rem;
      text-align: center;
      background: #000;
      color: #fff;
      font-size: .9rem;
    }
  </style>
</head>

<body>

<header>
  MC Keke – Video Portfolio
</header>

<main>
  <h1>Watch Highlights</h1>

  <section class="video-grid">

    <!-- VIDEO 1 -->
    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/RxRiiFnegRI?rel=0&modestbranding=1&playsinline=1"
          title="Wedding Comedy Special"
          allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <h3>Wedding Comedy Special</h3>
        <a href="https://www.youtube.com/watch?v=RxRiiFnegRI" target="_blank" rel="noopener">
          Watch on YouTube →
        </a>
      </div>
    </div>

    <!-- VIDEO 2 -->
    <div class="video-card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/K8NZm6RqjBk?rel=0&modestbranding=1&playsinline=1"
          title="Live Event Performance"
          allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <h3>Live Event Performance</h3>
        <a href="https://www.youtube.com/watch?v=K8NZm6RqjBk" target="_blank" rel="noopener">
          Watch on YouTube →
        </a>
      </div>
    </div>

    <!-- ADD MORE VIDEOS BELOW SAME WAY -->

  </section>
</main>

<footer>
  © 2026 MC Keke. All rights reserved.
</footer>

</body>
</html>
